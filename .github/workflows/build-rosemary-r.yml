name: Build Redmi Note 10S R-vendor kernel
run-name: "Rosemary R | ${{ inputs.variant || 'bakasu_susfs_nomount' }} | ${{ github.event_name }}"

on:
  push:
    branches:
      - rosemary-r-oss
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        default: bakasu_susfs_nomount
        type: choice
        options:
          - stock
          - resukisu
          - resukisu_nomount
          - bakasu_susfs
          - bakasu_susfs_nomount
      enable_bore:
        description: Enable experimental BORE scheduler 5.1.0
        required: false
        default: false
        type: boolean
      nomount_netlink_proto:
        description: NoMount Netlink protocol (requires matching nm userspace client)
        required: false
        default: "29"
        type: choice
        options:
          - "29"
          - "28"
      localversion:
        description: Extra LOCALVERSION suffix
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: rosemary_defconfig
  KBUILD_BUILD_USER: vildangil
  KBUILD_BUILD_HOST: github-actions
  BUILD_VARIANT: ${{ inputs.variant || 'bakasu_susfs_nomount' }}
  ENABLE_BORE: ${{ inputs.enable_bore && 'true' || 'false' }}
  NOMOUNT_NETLINK_PROTO: ${{ inputs.nomount_netlink_proto || '29' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates ccache curl flex git libelf-dev libssl-dev libncurses-dev lz4 python3 rsync unzip zip zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      - name: Clone toolchains
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../clang
          echo "$PWD/../clang/bin" >> "$GITHUB_PATH"

      - name: Integrate BakaSU manual hooks
        if: env.BUILD_VARIANT != 'stock'
        run: |
          set -euxo pipefail
          curl -fLSs https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh -o /tmp/bakasu-setup.sh
          bash /tmp/bakasu-setup.sh
          git apply --check .github/patches/bakasu-susfs-rosemary-sucompat.patch
          git apply .github/patches/bakasu-susfs-rosemary-sucompat.patch
          test -f drivers/kernelsu/Kconfig
          grep -q 'CONFIG_KSU' drivers/Makefile
          git apply --check .github/patches/bakasu-manual-hooks-4.14.patch
          git apply .github/patches/bakasu-manual-hooks-4.14.patch

      - name: Integrate SUSFS 2.3.0 from Evolution patch
        if: contains(env.BUILD_VARIANT, 'susfs')
        run: |
          set -euxo pipefail
          # Fail on rejects, don't silently claim a working SUSFS port.
          git apply --check .github/patches/susfs-2.3.0-rosemary.patch
          git apply .github/patches/susfs-2.3.0-rosemary.patch
          for item in 'kernel/sys.c:ksu_handle_setresuid' 'fs/read_write.c:ksu_handle_sys_read' 'drivers/input/input.c:ksu_handle_input_handle_event' 'fs/exec.c:ksu_handle_execveat' 'fs/open.c:ksu_handle_faccessat' 'fs/stat.c:ksu_handle_stat' 'kernel/reboot.c:ksu_handle_sys_reboot'; do
            grep -q "${item#*:}" "${item%%:*}" || { echo "Missing inline hook: $item"; exit 1; }
          done
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          grep -Fxq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h


      - name: Integrate NoMount
        if: contains(env.BUILD_VARIANT, 'nomount')
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/Bouteillepleine/NoMount-Suite.git /tmp/nomount-suite
          # The kernel and the userspace nm helper MUST share the same Netlink protocol.
          # Default 29 is unchanged for push builds. Protocol 28 is experimental/manual only.
          if [[ "$NOMOUNT_NETLINK_PROTO" == "28" ]]; then
            for hdr in /tmp/nomount-suite/hookless/src/nomount.h /tmp/nomount-suite/userspace/src/nm.h; do
              sed -i -E "s/(#define NOMOUNT_NL_PROTO[[:space:]]+)29$/\\1$NOMOUNT_NETLINK_PROTO/" "$hdr"
            done
            # Build a matching, freestanding AArch64 nm helper for the NoMount module.
            ../clang/bin/clang --target=aarch64-linux-android26 -Oz -static -nostdlib \
              -fuse-ld=lld -ffreestanding -fno-unwind-tables -fno-ident \
              -Wno-invalid-noreturn -Wl,--entry=_start \
              /tmp/nomount-suite/userspace/src/nm.c \
              -o "nomount-nm-proto${NOMOUNT_NETLINK_PROTO}-arm64"
            readelf -h "nomount-nm-proto${NOMOUNT_NETLINK_PROTO}-arm64" | grep -q 'AArch64'
          fi
          for hdr in /tmp/nomount-suite/hookless/src/nomount.h /tmp/nomount-suite/userspace/src/nm.h; do
            grep -qE "^#define NOMOUNT_NL_PROTO[[:space:]]+$NOMOUNT_NETLINK_PROTO$" "$hdr"
          done
          cp /tmp/nomount-suite/hookless/src/nomount.c fs/nomount.c
          cp /tmp/nomount-suite/hookless/src/nomount.h fs/nomount.h
          patch -p1 --fuzz=3 < /tmp/nomount-suite/hookless/patches/nomount_kernel_integration.patch
          grep -q 'config NOMOUNT' fs/Kconfig
          grep -q 'CONFIG_NOMOUNT' fs/Makefile
          grep -q 'vfs_map_meta_override' fs/proc/task_mmu.c

      - name: Upload matching NoMount client
        if: contains(env.BUILD_VARIANT, 'nomount') && env.NOMOUNT_NETLINK_PROTO == '28'
        uses: actions/upload-artifact@v4
        with:
          name: nomount-nm-proto28-${{ github.run_number }}
          path: nomount-nm-proto28-arm64
          if-no-files-found: error

      - name: Generate config
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 "$DEFCONFIG"
          if [[ "$ENABLE_BORE" == "true" ]]; then
            scripts/config --file out/.config -e SCHED_BORE
          else
            scripts/config --file out/.config -d SCHED_BORE
          fi

          if [[ "$BUILD_VARIANT" != "stock" ]]; then
            scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e KALLSYMS -e DEBUG_KERNEL -e KALLSYMS_ALL
          fi

          if [[ "$BUILD_VARIANT" == *susfs* ]]; then
            scripts/config --file out/.config -d KSU_MANUAL_HOOK -e KSU_SUSFS
            for opt in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
              scripts/config --file out/.config -e "$opt"
            done
          fi

          if [[ "$BUILD_VARIANT" == *nomount* ]]; then
            scripts/config --file out/.config -e NOMOUNT
          fi

          if [[ -n "${{ inputs.localversion || '' }}" ]]; then
            scripts/config --file out/.config --set-str LOCALVERSION "-liquid-Maika-${{ inputs.localversion || '' }}"
          fi

          make O=out ARCH=arm64 olddefconfig
          echo "===== important config ====="
          grep -E 'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|SCHED_BORE|NOMOUNT|KALLSYMS_ALL|LOCALVERSION)=' out/.config || true
          if [[ "$ENABLE_BORE" == "true" ]]; then
            grep -qx 'CONFIG_SCHED_BORE=y' out/.config
          fi
          if [[ "$BUILD_VARIANT" != "stock" ]]; then
            grep -qx 'CONFIG_KSU=y' out/.config
            grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config
          fi
          if [[ "$BUILD_VARIANT" == *susfs* ]]; then
            grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          else
            if [[ "$BUILD_VARIANT" != "stock" ]]; then
              grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
            fi
          fi
          if [[ "$BUILD_VARIANT" == *nomount* ]]; then
            grep -qx 'CONFIG_NOMOUNT=y' out/.config
          fi

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="$PWD/../clang/bin:$PATH"
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            LD=ld.lld \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            2>&1 | tee build.log

      - name: Verify outputs
        run: |
          set -eux
          ls -lah out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz || test -f out/arch/arm64/boot/Image.gz-dtb || test -f out/arch/arm64/boot/Image

      - name: Pack AnyKernel3
        run: |
          set -euxo pipefail
          git clone --depth=1 -b rosemary https://github.com/vildangil/BlackSide_Kernel_AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          BOOT=out/arch/arm64/boot
          [[ -f "$BOOT/Image" ]] && cp "$BOOT/Image" AnyKernel3/Image
          [[ -f "$BOOT/Image.gz" ]] && cp "$BOOT/Image.gz" AnyKernel3/Image.gz
          [[ -f "$BOOT/Image.gz-dtb" ]] && cp "$BOOT/Image.gz-dtb" AnyKernel3/Image.gz-dtb
          [[ -f "$BOOT/dtb" ]] && cp "$BOOT/dtb" AnyKernel3/dtb
          [[ -f "$BOOT/dtbo.img" ]] && cp "$BOOT/dtbo.img" AnyKernel3/dtbo.img

          find out -type f -name '*.ko' -print0 | while IFS= read -r -d '' module; do
            mkdir -p AnyKernel3/modules/system/lib/modules
            cp "$module" AnyKernel3/modules/system/lib/modules/
          done

          VERSION="$(make kernelversion)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          ZIP="rosemary-R-$BUILD_VARIANT-${VERSION}-${SHORT_SHA}.zip"
          (cd AnyKernel3 && zip -r9 "../$ZIP" . -x '*.git*' 'README.md')
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-R-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: |
            ${{ env.ZIP }}
            build.log
            out/.config
          if-no-files-found: error
